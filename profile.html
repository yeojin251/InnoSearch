<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>프로필 · InnoSearch</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/mem_styles.css" />
  <style>
    .profile-card{ max-width:860px; margin:24px auto; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; }
    .profile-head{ display:flex; gap:16px; align-items:center; }
    .avatar{ width:64px; height:64px; border-radius:999px; background:#e2e8f0;}
    .profile-body{ margin-top:12px; }
    .meta { color:#475569; font-size:14px; }
    .btn-row{ margin-top:16px; display:flex; gap:8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="./home.html">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12" /><path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor" /></svg></span>
        <span class="brand-text">InnoSearch</span>
      </a>
      <nav class="menu" aria-label="주요 메뉴">
        <a href="./matching.html">기술/분야</a>
        <a href="./goodex.html">우수사례</a>
        <a href="./organ.html">창업시설</a>
        <a href="./board.html">게시판</a>
      </nav>
      <div class="nav-actions">
        <a class="link" id="btn-login" href="./login.html">로그인</a>
        <a class="btn primary" id="btn-signup" href="./signup.html">회원가입</a>
        <a class="link" id="btn-mypage" href="./myLab.html" style="display:none;">마이페이지</a>
        <a class="link" id="btn-logout" href="#" style="display:none;">로그아웃</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="profile-card">
      <div class="profile-head">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <h2 id="p-name" style="margin:0;">사용자</h2>
          <div id="p-org" class="meta">소속: -</div>
        </div>
      </div>
      <div class="profile-body">
        <div><b>직업/역할:</b> <span id="p-job">-</span></div>
        <div><b>관심분야:</b> <span id="p-interests">-</span></div>
        <div style="margin-top:8px;"><b>소개:</b></div>
        <div id="p-bio" style="white-space:pre-wrap; margin-top:4px;"></div>

        <div class="btn-row">
          <button id="dm-btn" class="btn primary">채팅하기</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container foot">
      <div class="brand lite">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12" /><path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor" /></svg></span>
        <span class="brand-text">InnoSearch</span>
      </div>
      <div class="foot-right">
        <a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">고객센터</a>
      </div>
    </div>
  </footer>

  <script src="./js/apiClient.js"></script>
  <script src="./js/session.js"></script>
  <script src="./js/profile.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/chatModal.js"></script>
</body>
</html>
