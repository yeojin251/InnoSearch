<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InnoSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <!-- 헤더 -->
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="./home.html">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12" />
            <path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">InnoSearch</span>
      </a>

      <nav class="menu" aria-label="주요 메뉴">
        <a href="./matching.html">기술/분야</a>
        <a href="./goodex.html">우수사례</a>
        <a href="./organ.html">창업시설</a>
        <a href="./board.html">게시판</a>
      </nav>

      <div class="nav-actions">
        <a class="link" id="btn-login" href="./login.html">로그인</a>
        <a class="btn primary" id="btn-signup" href="./signup.html">회원가입</a>
        <a class="link" id="btn-mypage" href="./myLab.html" style="display:none;">마이페이지</a>
        <a class="link" id="btn-logout" href="#" style="display:none;">로그아웃</a>
        <span id="user-display" style="display:none; margin-right:10px; color:#666;"></span>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== Home Hero (기존 어두운 그라디언트 + 좌측 정렬) ===== -->
    <section class="hero align-left">
      <div class="container hero-inner">
        <div class="hero-copy">
          <!-- 제목: ‘만남’과 ‘혁신’ 다른 색 강조, 흰색 베이스 -->
          <h1 class="hero-lead">
            기술과 파트너의 <span class="accent">만남</span>으로<br>
            시작되는 <span class="accent2">혁신</span>
          </h1>

          <!-- 부제목: 흰색, 제목보다 작게 -->
          <p class="hero-sub">
            단순한 연결을 넘어, 성공의 가능성을 만듭니다.<br>
            혁신적인 아이디어 비즈니스가 되는 곳, 당신의 파트너를 만나보세요.
          </p>

          <!-- CTA: “지금 시작하기”만 유지 -->
          <div class="hero-cta">
            <a href="./login.html" class="btn primary">지금 시작하기</a>
          </div>
        </div>

        <!-- 데코(기존 동그란 공 유지) -->
        <div class="hero-art" aria-hidden="true">
          <div class="bubble b1"></div>
          <div class="bubble b2"></div>
          <div class="bubble b3"></div>
        </div>
      </div>

      <!-- 파도 -->
      <svg class="hero-wave wave-up" viewBox="0 0 1440 160" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,64 C180,128 360,0 540,26.7 C720,53.3 900,160 1080,144 C1260,128 1350,96 1440,80 L1440,160 L0,160 Z"/>
      </svg>

      <!-- JS 호환용 숨김 더미 (matching.js 안전) -->
      <div style="display:none">
        <input id="q" />
        <button id="matchBtn"></button>
        <div id="matchingResults"></div>
      </div>
    </section>
    <!-- ===== /Home Hero ===== -->

    <!-- 최신 리포트 -->
    <section id="updates" class="section">
      <div class="container section-head">
        <h2>최신 리포트</h2>
      </div>
      <div class="container cards" id="report-cards-container"></div>
    </section>

    <!-- 최신 트렌드 -->
    <section class="section tags">
      <div class="container section-head">
        <h2>최신 트렌드</h2>
      </div>
      <div class="container tag-list" role="list">
        <a href="#" class="tag" role="listitem">팝업스토어</a>
        <a href="#" class="tag" role="listitem">MZ세대</a>
        <a href="#" class="tag" role="listitem">숏폼</a>
        <a href="#" class="tag" role="listitem">시니어</a>
        <a href="#" class="tag" role="listitem">취미</a>
        <a href="#" class="tag" role="listitem">고물가</a>
        <a href="#" class="tag" role="listitem">AI</a>
        <a href="#" class="tag" role="listitem">이커머스</a>
        <a href="#" class="tag" role="listitem">비건</a>
        <a href="#" class="tag" role="listitem">ESG</a>
        <a href="#" class="tag" role="listitem">유튜브</a>
        <a href="#" class="tag" role="listitem">가성비</a>
        <a href="#" class="tag" role="listitem">1인가구</a>
      </div>
    </section>
  </main>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="container foot">
      <div class="brand lite">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12" />
            <path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">InnoSearch</span>
      </div>
      <div class="foot-right">
        <a href="#">이용약관</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">고객센터</a>
      </div>
    </div>
  </footer>

  <!-- AI 위젯 컨테이너 -->
  <div id="ai-fab-root"></div>

  <!-- 페이지 컨텍스트(선택) -->
  <script>
    window.__innosearch_context = { page: 'home' };
  </script>

  <!-- 위젯 스크립트 -->
  <script defer src="./js/aiWidget.js"></script>
  <link rel="stylesheet" href="./css/aiWidget.css">

  <!-- 1) 소켓과 API/세션 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/apiClient.js"></script>
  <script src="./js/session.js"></script>

  <!-- 2) DM 모달 -->
  <script src="./js/chatModal.js"></script>

  <!-- 3) 페이지별 스크립트 -->
  <script src="./js/matching.js"></script>
  <script src="./js/home.js"></script>
</body>
</html>
