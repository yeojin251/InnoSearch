<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 – InnoSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/mem_styles.css?v=3" />

  <style>
    /* 작고 깔끔한 체크박스 + 한 줄 정렬 */
    .checkbox-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .checkbox-line span {
      white-space: nowrap;
    }

    input.tiny-check[type="checkbox"] {
      appearance: none !important;
      -webkit-appearance: none !important;
      width: 1em !important;
      height: 1em !important;
      border: 1.5px solid #cfd6e4 !important;
      border-radius: 0.25em !important;
      background: #fff !important;
      display: inline-block;
      vertical-align: -0.2em;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: border-color .15s, background-color .15s, box-shadow .15s;
    }

    input.tiny-check[type="checkbox"]:checked {
      background: var(--brand, #4f46e5) !important;
      border-color: var(--brand, #4f46e5) !important;
    }

    input.tiny-check[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 0.28em;
      top: 0.04em;
      width: 0.38em;
      height: 0.65em;
      border: 2px solid #fff;
      border-top: 0;
      border-left: 0;
      transform: rotate(45deg);
    }

    input.tiny-check[type="checkbox"]:focus-visible {
      box-shadow: 0 0 0 3px rgba(79,70,229,.25);
    }
  </style>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="./home.html"><span class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12"/><path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor"/></svg>
      </span><span class="brand-text">InnoSearch</span></a>
    </div>
  </header>

  <main class="auth">
    <section class="auth-hero">
      <div class="container">
        <h1>회원가입</h1>
        <p class="sub">회원정보를 입력해 주세요.</p>
      </div>
    </section>

    <section class="auth-body">
      <div class="container">
        <form class="auth-card" action="#" method="post" novalidate>
          <div class="field">
            <label for="name">이름</label>
            <input id="name" name="name" type="text" placeholder="홍길동" required>
          </div>

          <!-- 닉네임 -->
          <div class="field">
            <label for="nickname">닉네임 <span class="muted small">(한 번 설정하면 변경 불가)</span></label>
            <input id="nickname" name="nickname" type="text" placeholder="표시할 닉네임" required minlength="2" maxlength="24" autocomplete="off">
          </div>

          <!-- 닉네임 표시 여부 체크박스 -->
          <div class="field inline">
            <label class="checkbox-line" for="show_nickname">
              <input id="show_nickname" name="show_nickname" type="checkbox" class="tiny-check" checked>
              <span>게시글/댓글에 <strong>닉네임</strong>으로 표시</span>
            </label>
          </div>

          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" required>
          </div>

          <div class="row-2">
            <div class="field">
              <label for="pw">비밀번호</label>
              <div class="pw-wrap">
                <input id="pw" name="password" type="password" placeholder="최소 8자" required minlength="8">
                <button type="button" class="pw-toggle" onclick="togglePw('pw', this)">보기</button>
              </div>
            </div>
            <div class="field">
              <label for="pw2">비밀번호 확인</label>
              <div class="pw-wrap">
                <input id="pw2" name="password2" type="password" placeholder="다시 입력" required minlength="8">
                <button type="button" class="pw-toggle" onclick="togglePw('pw2', this)">보기</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="org">소속/기업명 (선택)</label>
            <input id="org" name="org" type="text" placeholder="InnoSearch Lab">
          </div>

          <button class="btn primary full" type="submit" id="signupBtn">계정 만들기</button>

          <p class="muted center small">
            이미 계정이 있나요? <a class="link-strong" href="./login.html">로그인</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container foot">
      <div class="brand lite">
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="currentColor" opacity=".12"/><path d="M12 6l6.06 3.5v7L12 20l-6.06-3.5v-7z" fill="currentColor"/></svg></span>
        <span class="brand-text">InnoSearch</span>
      </div>
      <div class="foot-right">
        <a href="#">이용약관</a><a href="#">개인정보처리방침</a><a href="#">고객센터</a>
      </div>
    </div>
  </footer>

  <script src="./js/apiClient.js"></script>
  <script src="./js/signup.js"></script>
  <script>
    function togglePw(id, btn){
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
      btn.textContent = el.type === 'password' ? '보기' : '숨기기';
    }
  </script>
</body>
</html>
